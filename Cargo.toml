[package]
name = "dvma"
version = "0.1.0"
edition = "2021"
authors = ["DVMA Team"]
description = "Digital Visual Matrix Authentication & Encryption Protocol v1.0"

[dependencies]
chacha20poly1305 = "0.10"
rand = "0.8"
image = "0.25"
png = "0.17"
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
crc32fast = "1.3"
hex = "0.4"
subtle = "2.5"

[dev-dependencies]
tempfile = "3.8"
